<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简记药箱 · JianjiBox</title>
<style>
  :root { --primary: #30B0C7; --bg: #f2f4f7; --card: #ffffff; --text: #1d1d1f; --text-secondary: #6e6e73; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif; background: var(--bg); color: var(--text); line-height: 1.7; }
  .hero { background: linear-gradient(135deg, var(--primary) 0%, #1a8a9f 100%); color: #fff; text-align: center; padding: 64px 20px 48px; }
  .hero h1 { font-size: 2.4rem; font-weight: 700; }
  .hero p { font-size: 1rem; opacity: .85; margin-top: 8px; }
  .container { max-width: 560px; margin: 0 auto; padding: 40px 20px 80px; }
  .links { display: flex; flex-direction: column; gap: 16px; }
  a.card { display: flex; align-items: center; gap: 16px; background: var(--card); border-radius: 16px; padding: 24px; text-decoration: none; color: var(--text); box-shadow: 0 2px 12px rgba(0,0,0,.05); transition: transform .15s; }
  a.card:hover { transform: translateY(-2px); }
  .icon { font-size: 2rem; }
  .card h2 { font-size: 1.15rem; }
  .card p { font-size: .9rem; color: var(--text-secondary); }
  footer { text-align: center; padding: 32px 20px; font-size: .8rem; color: #aaa; }
  @media (max-width: 600px) { .hero h1 { font-size: 1.8rem; } }
</style>
</head>
<body>

<div class="hero">
  <h1>💊 简记药箱</h1>
  <p>JianjiBox · 简单记录 健康生活</p>
</div>

<div class="container">
  <div class="links">
    <a class="card" href="help.html">
      <div class="icon">📖</div>
      <div><h2>使用手册</h2><p>User Guide</p></div>
    </a>
    <a class="card" href="privacy.html">
      <div class="icon">🔐</div>
      <div><h2>隐私政策</h2><p>Privacy Policy</p></div>
    </a>
  </div>
</div>

<footer>© 2026 简记药箱 JianjiBox</footer>

</body>
</html>
